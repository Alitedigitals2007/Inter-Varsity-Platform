# Realtime service deployment (Render blueprint).
# This is the long-running Socket.IO + timer process that cannot run on
# Vercel's serverless functions. Deploy the Next.js app to Vercel and this
# service to Render (or Railway / Fly / a VPS), then point
# NEXT_PUBLIC_REALTIME_URL at this service's public URL.
#
# Usage: New → Blueprint → point at this repo. Set the secrets below in the
# Render dashboard (do not commit real values).

services:
  - type: web
    name: fassa-realtime
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx realtime/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: REALTIME_PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REALTIME_INTERNAL_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
    healthCheckPath: /health
